<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation de salles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }
  h1 { text-align: center; padding: 1.2rem; background: #fff; border-bottom: 1px solid #ddd; font-size: 20px; font-weight: 500; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; background: #fff; border-bottom: 1px solid #ddd; }
  .nav { display: flex; align-items: center; gap: 12px; }
  .nav button { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 14px; }
  .date-label { font-size: 15px; font-weight: 500; min-width: 200px; text-align: center; }
  .btn-admin { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; color: #666; }
  .btn-admin.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 1rem; max-width: 960px; margin: 0 auto; }
  .salle { background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
  .salle-header { padding: 10px 14px; background: #f9f9f9; border-bottom: 1px solid #eee; font-weight: 500; font-size: 15px; }
  .slot { display: flex; align-items: center; padding: 9px 14px; border-bottom: 1px solid #f0f0f0; font-size: 14px; gap: 8px; min-height: 48px; }
  .slot:last-child { border-bottom: none; }
  .slot-time { color: #888; min-width: 50px; }
  .slot-libre { color: #bbb; font-style: italic; cursor: pointer; flex: 1; }
  .slot-libre:hover { color: #4a90e2; text-decoration: underline; }
  .slot-team { flex: 1; font-weight: 500; font-size: 14px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
  .badge-entrevue { background: #fff3cd; color: #856404; }
  .badge-reunion { background: #d1ecf1; color: #0c5460; }
  .badge-formation { background: #e8d5f5; color: #6a0dad; }
  .slot-actions { display: flex; gap: 4px; margin-left: auto; }
  .btn-icon { font-size: 11px; color: #aaa; background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .btn-icon:hover { background: #f0f0f0; color: #333; }
  .btn-icon.del:hover { color: #e74c3c; }
  .vue-semaine { padding: 1rem; max-width: 1200px; margin: 0 auto; overflow-x: auto; display: none; }
  .semaine-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .semaine-table th { background: #f9f9f9; border: 1px solid #ddd; padding: 6px 8px; text-align: center; font-weight: 500; white-space: nowrap; }
  .semaine-table td { border: 1px solid #eee; padding: 4px 6px; vertical-align: top; min-width: 85px; }
  .col-heure { color: #888; font-size: 11px; white-space: nowrap; background: #fafafa !important; text-align: right !important; padding-right: 8px !important; min-width: 45px; }
  .cell-res { border-radius: 4px; padding: 3px 5px; margin: 1px 0; font-size: 11px; }
  .cell-res.entrevue { background: #fff3cd; }
  .cell-res.reunion { background: #d1ecf1; }
  .cell-res.formation { background: #e8d5f5; }
  .res-team { font-weight: 500; }
  .res-annuler { float: right; cursor: pointer; color: #aaa; font-size: 10px; background: none; border: none; padding: 0; }
  .semaine-salle-header { color: #fff; text-align: center; font-weight: 500; padding: 8px; font-size: 14px; }
  .semaine-salle-header.s1 { background: #4a90e2; }
  .semaine-salle-header.s2 { background: #27ae60; }
  .semaine-salle-header.s3 { background: #e67e22; }
  .salle-header.s1 { background: #e8f4fd; border-left: 4px solid #4a90e2; }
  .salle-header.s2 { background: #eafaf1; border-left: 4px solid #27ae60; }
  .salle-header.s3 { background: #fef5e7; border-left: 4px solid #e67e22; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 1.5rem; width: 400px; max-width: 95vw; }
  .modal h2 { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .modal-btns { display: flex; gap: 8px; margin-top: 1rem; }
  .btn-confirm { flex: 1; padding: 9px; background: #4a90e2; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .btn-close { padding: 9px 16px; background: none; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .pin-modal { background: #fff; border-radius: 12px; padding: 1.5rem; width: 300px; }
  .pin-modal input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px; }
  .pin-error { color: #e74c3c; font-size: 12px; display: none; }
  .loading { text-align: center; padding: 2rem; color: #aaa; font-size: 14px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; display: none; z-index: 200; }
</style>
</head>
<body>

<h1>📅 Réservation de salles</h1>

<div class="top-bar">
  <div class="nav">
    <button onclick="changeDay(-1)" id="btn-prev">◀</button>
    <div class="date-label" id="date-label"></div>
    <button onclick="changeDay(1)" id="btn-next">▶</button>
  </div>
  <button class="btn-admin" id="btn-admin-toggle" onclick="toggleAdmin()">🔒 Vue admin</button>
</div>

<div id="vue-jour"><div class="grid" id="grid"><div class="loading" style="grid-column:span 3">Chargement...</div></div></div>
<div class="vue-semaine" id="vue-semaine"></div>

<!-- Modal Réservation -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2 id="modal-title">Réserver</h2>
    <div class="form-group"><label>Nom / Équipe</label><input id="f-equipe" type="text" /></div>
    <div class="form-group"><label>Type</label>
      <select id="f-type">
        <option value="Entrevue">🎯 Entrevue</option>
        <option value="Réunion">👥 Réunion</option>
        <option value="Formation">🎓 Formation</option>
      </select>
    </div>
    <div class="form-group"><label>Réservé par</label><input id="f-par" type="text" /></div>
    <div class="form-group"><label>Heure</label><select id="f-heure"></select></div>
    <div class="modal-btns">
      <button class="btn-close" onclick="fermerModal()">Annuler</button>
      <button class="btn-confirm" onclick="confirmer()">Confirmer</button>
    </div>
  </div>
</div>

<!-- Modal Déplacer -->
<div class="modal-bg" id="move-modal-bg">
  <div class="modal">
    <h2 id="move-title">Déplacer / Dupliquer</h2>
    <div class="form-group"><label>Nom / Équipe</label><input id="move-equipe" type="text" /></div>
    <div class="form-group"><label>Type</label>
      <select id="move-type">
        <option value="Entrevue">🎯 Entrevue</option>
        <option value="Réunion">👥 Réunion</option>
        <option value="Formation">🎓 Formation</option>
      </select>
    </div>
    <div class="form-group"><label>Salle</label>
      <select id="move-salle">
        <option value="Salle 1">Salle 1</option>
        <option value="Salle 2">Salle 2</option>
        <option value="Salle 3">Salle 3</option>
      </select>
    </div>
    <div class="form-group"><label>Date</label><input id="move-date" type="date" /></div>
    <div class="form-group"><label>Heure</label><select id="move-heure"></select></div>
    <div class="modal-btns">
      <button class="btn-close" onclick="fermerMoveModal()">Annuler</button>
      <button class="btn-confirm" style="background:#27ae60" onclick="executerMove(false)">Dupliquer</button>
      <button class="btn-confirm" onclick="executerMove(true)">Déplacer</button>
    </div>
  </div>
</div>

<!-- Modal PIN -->
<div class="modal-bg" id="pin-bg">
  <div class="pin-modal">
    <h2 id="pin-title">Code Admin</h2>
    <input id="pin-input" type="password" onkeydown="if(event.key==='Enter')verifierPin()" />
    <div class="pin-error" id="pin-error">Code incorrect</div>
    <div class="modal-btns">
      <button class="btn-close" onclick="fermerPin()">Annuler</button>
      <button class="btn-confirm" onclick="verifierPin()">Confirmer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwXVb-DTwKUsa4OlGcltIiPINI3REUkAMRqXc58RMqbvDfzdHEMl1ldlWXyUOVbxj4y_w/exec';

const SALLES = ['Salle 1', 'Salle 2', 'Salle 3'];
const PIN = '1234';
const HEURES = ['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];

let currentOffset = 0, reservations = [], pendingSalle = null, pendingDate = null;
let pendingDeleteId = null, pinMode = null, adminMode = false, cbCounter = 0, moveRes = null;

function jsonp(params) {
  return new Promise((resolve) => {
    const cbName = '__cb' + (cbCounter++);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup(); resolve([]);
    }, 6000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (document.body.contains(script)) document.body.removeChild(script);
    }

    window[cbName] = function(data) { cleanup(); resolve(data); };
    script.onerror = function() { cleanup(); resolve([]); };

    params.callback = cbName;
    params.t = Date.now();
    const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    script.src = API + '?' + qs;
    document.body.appendChild(script);
  });
}

function dateKey(offset) { const d = new Date(); d.setDate(d.getDate() + offset); return d.toISOString().slice(0, 10); }
function dateLabel(offset) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  const s = d.toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });
  if (offset === 0) return "Aujourd'hui — " + s;
  if (offset === 1) return 'Demain — ' + s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dateLabelCourt(dk) { return new Date(dk + 'T12:00:00').toLocaleDateString('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' }); }

function changeDay(delta) {
  if (adminMode) return;
  currentOffset = Math.max(0, Math.min(13, currentOffset + delta));
  document.getElementById('date-label').textContent = dateLabel(currentOffset);
  charger();
}

async function charger() {
  if (adminMode) document.getElementById('vue-semaine').innerHTML = '<div class="loading">Chargement...</div>';
  else document.getElementById('grid').innerHTML = '<div class="loading" style="grid-column:span 3">Chargement...</div>';
  const data = await jsonp({ action: 'getAll' });
  reservations = Array.isArray(data) ? data : [];
  if (adminMode) renderSemaine(); else render();
}

function badgeClass(type) { return type === 'Entrevue' ? 'badge-entrevue' : type === 'Réunion' ? 'badge-reunion' : 'badge-formation'; }
function cellClass(type) { return type === 'Entrevue' ? 'entrevue' : type === 'Réunion' ? 'reunion' : 'formation'; }

function render() {
  const dk = dateKey(currentOffset);
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  SALLES.forEach(salle => {
    const div = document.createElement('div'); div.className = 'salle';
    let slots = HEURES.map(h => {
      const res = reservations.find(r => r.salle === salle && r.date === dk && r.heure === h);
      if (res) {
        return `<div class="slot">
          <span class="slot-time">${h}</span><span class="slot-team">${res.equipe}</span>
          <span class="badge ${badgeClass(res.type)}">${res.type}</span>
          <div class="slot-actions">
            <button class="btn-icon" onclick="ouvrirMoveModal('${res.id}')">⇄</button>
            <button class="btn-icon del" onclick="demanderSuppression('${res.id}')">✕</button>
          </div></div>`;
      }
      return `<div class="slot"><span class="slot-time">${h}</span><span class="slot-libre" onclick="ouvrirModal('${salle}','${h}','${dk}')">+ Réserver</span></div>`;
    }).join('');
    div.innerHTML = `<div class="salle-header s${SALLES.indexOf(salle) + 1}">${salle}</div>${slots}`;
    grid.appendChild(div);
  });
}

function renderSemaine() {
  const days = Array.from({length:14}, (_, i) => dateKey(i));
  let html = '';
  SALLES.forEach(salle => {
    html += `<div style="margin-bottom:2rem"><div class="semaine-salle-header s${SALLES.indexOf(salle)+1}">${salle}</div>
      <table class="semaine-table"><thead><tr><th class="col-heure">Heure</th>${days.map(d => `<th>${dateLabelCourt(d)}</th>`).join('')}</tr></thead><tbody>`;
    HEURES.forEach(h => {
      html += `<tr><td class="col-heure">${h}</td>`;
      days.forEach(dk => {
        const res = reservations.find(r => r.salle === salle && r.date === dk && r.heure === h);
        html += res ? `<td><div class="cell-res ${cellClass(res.type)}"><button class="res-annuler" onclick="demanderSuppression('${res.id}')">✕</button><div class="res-team">${res.equipe}</div></div></td>` 
                    : `<td style="cursor:pointer;color:#ddd;text-align:center" onclick="ouvrirModal('${salle}','${h}','${dk}')">+</td>`;
      });
      html += '</tr>';
    });
    html += 'tbody</table></div>';
  });
  document.getElementById('vue-semaine').innerHTML = html;
}

function ouvrirModal(salle, heure, date) {
  pendingSalle = salle; pendingDate = date;
  document.getElementById('modal-title').textContent = `Réserver ${salle}`;
  document.getElementById('f-equipe').value = ''; document.getElementById('f-par').value = '';
  document.getElementById('f-heure').innerHTML = HEURES.filter(h => !reservations.find(r => r.salle === salle && r.date === date && r.heure === h))
    .map(h => `<option value="${h}" ${h === heure ? 'selected' : ''}>${h}</option>`).join('');
  document.getElementById('modal-bg').classList.add('open');
}

function fermerModal() { document.getElementById('modal-bg').classList.remove('open'); }

async function confirmer() {
  const equipe = document.getElementById('f-equipe').value.trim(), par = document.getElementById('f-par').value.trim();
  if (!equipe || !par) return toast('Veuillez tout remplir');
  fermerModal(); toast('Enregistrement...');
  await jsonp({ action: 'add', salle: pendingSalle, date: pendingDate, heure: document.getElementById('f-heure').value, equipe, type: document.getElementById('f-type').value, reservePar: par });
  toast('Confirmé ✓'); await charger();
}

function ouvrirMoveModal(id) {
  moveRes = reservations.find(r => r.id === id); if (!moveRes) return;
  document.getElementById('move-equipe').value = moveRes.equipe;
  document.getElementById('move-type').value = moveRes.type;
  document.getElementById('move-salle').value = moveRes.salle;
  document.getElementById('move-date').value = moveRes.date;
  document.getElementById('move-heure').innerHTML = HEURES.map(h => `<option value="${h}" ${h === moveRes.heure ? 'selected' : ''}>${h}</option>`).join('');
  document.getElementById('move-modal-bg').classList.add('open');
}
function fermerMoveModal() { document.getElementById('move-modal-bg').classList.remove('open'); }

async function executerMove(isMove) {
  if (!moveRes) return;
  const equipe = document.getElementById('move-equipe').value.trim(); if (!equipe) return;
  fermerMoveModal(); toast('Mise à jour...');
  if (isMove) await jsonp({ action: 'delete', id: moveRes.id });
  await jsonp({ action: 'add', salle: document.getElementById('move-salle').value, date: document.getElementById('move-date').value, heure: document.getElementById('move-heure').value, equipe, type: document.getElementById('move-type').value, reservePar: moveRes.reservePar });
  toast('Terminé ✓'); await charger();
}

function demanderSuppression(id) { pendingDeleteId = id; pinMode = 'delete'; document.getElementById('pin-bg').classList.add('open'); }
function toggleAdmin() {
  if (!adminMode) { pinMode = 'admin'; document.getElementById('pin-bg').classList.add('open'); }
  else { adminMode = false; document.getElementById('vue-jour').style.display='block'; document.getElementById('vue-semaine').style.display='none'; charger(); }
}
function fermerPin() { document.getElementById('pin-bg').classList.remove('open'); }
function verifierPin() {
  if (document.getElementById('pin-input').value === PIN) {
    fermerPin();
    if (pinMode === 'admin') { adminMode = true; document.getElementById('vue-jour').style.display='none'; document.getElementById('vue-semaine').style.display='block'; charger(); }
    else if (pinMode === 'delete') { jsonp({ action: 'delete', id: pendingDeleteId }).then(() => { toast('Annulé ✓'); charger(); }); }
  } else { document.getElementById('pin-error').style.display = 'block'; }
}

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }

document.getElementById('date-label').textContent = dateLabel(0);
charger();
</script>
</body>
</html>
